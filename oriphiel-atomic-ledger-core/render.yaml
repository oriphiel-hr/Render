# Render Blueprint — oriphiel-atomic-ledger-core
# Repo: https://github.com/oriphiel-hr/Render (monorepo)
# Blueprint path u Renderu: oriphiel-atomic-ledger-core/render.yaml

services:
  - type: web
    name: oriphiel-atomic-ledger
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: oriphiel-atomic-ledger-core
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: oriphiel-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: oriphiel-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: oriphiel-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: oriphiel-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: oriphiel-postgres
          property: password
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_HOST
        fromService:
          name: oriphiel-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: oriphiel-redis
          type: keyvalue
          property: port
      - key: EXCHANGE_ENABLED
        value: "false"
      - key: EXCHANGE_MODE
        value: testnet
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
    # Docker runtime: nema Start Command — CMD je u Dockerfile (render-entrypoint.sh)

  - type: keyvalue
    name: oriphiel-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: oriphiel-postgres
    plan: free
    region: frankfurt
    databaseName: oriphiel_ledger
    user: oriphiel
