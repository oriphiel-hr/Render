# Render Blueprint: Web servis + PostgreSQL
# Monorepo: u Render UI postavi Blueprint path na uslugar-webhooks/render.yaml
# ili Root Directory na uslugar-webhooks kad ručno povezuješ repo.
# Outbound IP rasponi: render-network.txt

databases:
  - name: uslugar-webhooks-db
    plan: free
    region: frankfurt
    databaseName: uslugar_webhooks
    user: webhooks

services:
  - type: web
    name: uslugar-webhooks
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    rootDir: uslugar-webhooks
    healthCheckPath: /health
    buildCommand: npm ci && npm run migrate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: uslugar-webhooks-db
          property: connectionString
      # Ručno u dashboardu: VERIFY_TOKEN, FACEBOOK_APP_SECRET, INGEST_API_KEY,
      # ADMIN_PANEL_TOKEN, META_WEBHOOK_PROFILES, META_*_VERIFY_TOKEN, META_*_APP_SECRET
