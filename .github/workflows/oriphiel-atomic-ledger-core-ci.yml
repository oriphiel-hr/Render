# Monorepo Render: Laravel u oriphiel-atomic-ledger-core
# (oriphiel-atomic-ledger-core/.github/workflows/ GitHub NE izvršava u ovom repou)

name: oriphiel-atomic-ledger-core CI

on:
  push:
    branches: [main, develop]
    paths:
      - "oriphiel-atomic-ledger-core/**"
      - ".github/workflows/oriphiel-atomic-ledger-core-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "oriphiel-atomic-ledger-core/**"
      - ".github/workflows/oriphiel-atomic-ledger-core-ci.yml"
  workflow_dispatch:

concurrency:
  group: oriphiel-atomic-ledger-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: oriphiel-atomic-ledger-core

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oriphiel_ledger_test
          POSTGRES_USER: oriphiel
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oriphiel -d oriphiel_ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, pdo_pgsql, redis, pcntl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: oriphiel_ledger_test
          DB_USERNAME: oriphiel
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: oriphiel_ledger_test
          DB_USERNAME: oriphiel
          DB_PASSWORD: secret
          CACHE_STORE: redis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test
